name: Gardener trend

# Record-only for the first 4 weeks: always exits 0, no thresholds.
# After 4 weekly history.json points, propose gates.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      merge_sha:
        description: "Merge commit SHA for compare (gitflow local merge)"
        default: "HEAD"

permissions:
  contents: read

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0 # compare walks HEAD^1; shallow depth-1 has no parent
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: mkdir -p artifacts/gardener
      - run: npx --yes repo-gardener snapshot --json > artifacts/gardener/snapshot-$(date -u +%F).json
      - run: npx --yes repo-gardener history --weeks 26 --json > artifacts/gardener/history.json
      - run: npx --yes repo-gardener compare "${{ inputs.merge_sha }}" --days 28 --json > artifacts/gardener/compare.json
        if: github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@v4
        with:
          name: gardener-trend
          path: artifacts/gardener/
          retention-days: 90
